<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>
    <section class="sobre">
        <h2>Sobre Mim</h2>
        <p>sou aluno do curso técnico de desenvolvimento de sistemas.</p>
        <img src="foto.jpg" alt="foto de perfil" class="foto-perfil">
    </section>

    <section class="projetos">
        <h2>Meus Projetos</h2>
        <div class="grid-projetos">
            <div class="card">
                <h3>Projeto 1</h3>
                <p>Lading page para um negócio local.</p>
            </div>
            <div class="card">
                <h3>Projeto 2</h3>
                <p>Clone de um card de produto.</p>
            </div>
            <div class="card">
                <h3>Projeto 3</h3>
                <p>Portifóiio pessoal.</p>
            </div>
        </div>
    </section>

    <section class="contato">
        <h2>Contato</h2>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome">

            <label for="email">Email:</label>
            <input type="email" id="email">

            <button type="submit">Enviar</button>
        </form>
    </section>


</body>

</html>
